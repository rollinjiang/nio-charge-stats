# ============================================================
# NIO 充换电站数据看板 · 云端定时抓取
# 每天 2 次触发，抓取+聚合+提交到 main
# ============================================================
name: Daily NIO stats

on:
  schedule:
    # 每天 2 次（GitHub cron 使用 UTC 时间）：
    #   UTC 00:30 = 北京时间 08:30  ← 上午场
    #   UTC 12:30 = 北京时间 20:30  ← 晚间场
    # 注意：GitHub cron 官方称有 5-30 分钟延迟，免费账户高峰时段实测
    #       可能延迟 1-5 小时，属正常现象，不是配置错误。
    - cron: '30 0 * * *'
    - cron: '30 12 * * *'
  workflow_dispatch:        # 允许在 GitHub 网页手动触发
  # 注意：不监听 push 触发器，避免与 schedule 撞车时产生 merge conflict
  # 改源码后想立即跑一次抓取，请手动点 workflow_dispatch 或改 schedule 时间

permissions:
  contents: write            # 允许 push 回 main

concurrency:
  group: daily-nio
  cancel-in-progress: false  # 不取消进行中的任务

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # 需要完整 history 以便 commit

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 防御：清理 data/ 可能残留的 git 冲突标记
        # 防御层：若之前 push 撞车导致 HEAD 的 data/ 包含 <<<<<<< 标记，
        # 丢弃 HEAD 的污染版本（scraper 会马上重写）
        run: |
          git checkout HEAD -- data/ 2>/dev/null || true
          # 额外保险：如果文件仍含冲突标记，从 git 历史里 grep 排除
          if grep -rl '<<<<<<< HEAD' data/ 2>/dev/null; then
            echo "::warning::data/ still has conflict markers after checkout, will be overwritten by scraper"
          fi

      - name: 抓取 NIO 当日数据
        run: node scraper/nio_http.js

      - name: 抓取全国分省换电站数据
        run: node scraper/nio_province.js

      - name: 聚合指标 (日/周/月/年)
        run: node aggregate/agg.js

      - name: 聚合分省指标 (日/周/月/年)
        run: node aggregate/province_agg.js

      - name: 检查变更
        id: diff
        run: |
          if git diff --staged --quiet && git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 提交并推送
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "NIO Stats Bot"
          git config user.email "actions@users.noreply.github.com"
          # 再次防御：抓取/聚合后 data/ 如果意外还有冲突标记，丢弃污染部分
          if grep -rl '<<<<<<< HEAD' data/ 2>/dev/null; then
            echo "::error::data/ contains conflict markers after scraper. Aborting."
            exit 1
          fi
          git add data/
          git commit -m "chore(data): daily NIO stats $(date -u '+%Y-%m-%d') [skip ci]"
          git push
